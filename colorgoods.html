<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ColorGoods" />
<meta name="description" content="Coloring Goods - a cozy canvas and pages to colour in." />
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="build" content="dev" />

<title>Coloring Goods</title>
<!-- Its own manifest and icon, so "Add to Home Screen" from THIS page makes
     an app that opens straight into Coloring Goods, not Roar Battle. -->
<link rel="manifest" href="colorgoods.webmanifest?v=dev" />
<link rel="apple-touch-icon" href="colorgoods-icon.png?v=dev" />
<link rel="icon" href="colorgoods-icon.png?v=dev" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link id="cg-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" />
<link rel="stylesheet" href="colorgoods.css?v=dev" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; overscroll-behavior: none; }
  body { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="goods" hidden></div>

<script src="animals.js?v=dev"></script>
<script src="game-colour.js?v=dev"></script>
<script src="colorgoods.js?v=dev"></script>
<script>
  // Stand-alone: the whole page is the app, and EXIT goes to Roar Battle.
  ColorGoods.open({
    root: document.getElementById('goods'),
    onExit: function () { location.href = './'; }
  });
</script>
</body>
</html>
