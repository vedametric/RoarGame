name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Cache busting: rewrite every ?v=dev to the commit being deployed, so a
      # new build asks the phone for file URLs it has never fetched before and
      # nobody ends up running last week's JavaScript against this week's HTML.
      - name: Stamp the build
        run: |
          BUILD="$(git rev-parse --short HEAD)"
          echo "Stamping build $BUILD"
          for PAGE in index.html colorgoods.html; do
            sed -i "s/?v=dev/?v=$BUILD/g; s/name=\"build\" content=\"dev\"/name=\"build\" content=\"$BUILD\"/" "$PAGE"
            grep -c "?v=$BUILD" "$PAGE"
          done

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  # Its own job, as in GitHub's own Pages template: deploying in the same job
  # as the upload started failing with "Found 0 artifact(s)".
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
